name: ELO Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  qualidade-e-build:
    name: "Verificar qualidade e compilar"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔑 Configurar local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: 🔥 Configurar google-services.json se secret existir
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          fi

      - name: ✅ Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: 🧪 Rodar testes unitários
        run: ./gradlew test

      - name: 🏗️ Compilar APK de Debug
        run: ./gradlew assembleDebug

      - name: 📦 Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: elo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
